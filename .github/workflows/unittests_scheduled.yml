on:
  schedule:
    - cron:  '0 16 * * 2,4' # tuesday and thursday at 17:00

name: scheduled unit-tests

jobs:
  unit-tests:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: "4.1.0"}
          - {os: macOS-latest,   r: "4.1.0"}
          - {os: ubuntu-20.04,   r: "4.1.0"}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_REMOTES_UPGRADE: never
      VDIFFR_RUN_TESTS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v2

      - uses: r-lib/actions/setup-r@master
        with:
          r-version: ${{ matrix.config.r }}

      - uses: jasp-stats/jasp-actions/setup-test-env@master
        with:
          requiresJAGS: true

      - name: Run unit tests
        run: source("tests/testthat.R")
        shell: Rscript {0}
