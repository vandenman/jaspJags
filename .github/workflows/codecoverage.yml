# adapted from https://github.com/r-lib/actions/tree/master/examples#test-coverage-workflow

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      COVERAGE: "true"

    steps:
      - uses: actions/checkout@v2

      - uses: r-lib/actions/setup-r@v1
        with:
          r-version: "4.1.0"
          use-public-rspm: true

      - uses: jasp-stats/jasp-actions/setup-test-env@master
        with:
          requiresJAGS: true

      - uses: r-lib/actions/setup-r-dependencies@v1
        with:
          extra-packages: |
            covr
            jasp-stats/jaspTools

      - name: setup jaspTools
        run: jaspTools::setupJaspTools()
        shell: Rscript {0}

      - name: Test coverage
        run: covr::codecov(quiet = FALSE)
        shell: Rscript {0}
