# adapted from https://github.com/r-lib/actions/tree/master/examples#test-coverage-workflow

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-20.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      COVERAGE: "true"
    steps:
      - uses: actions/checkout@v2

      - uses: r-lib/actions/setup-r@v1
        with:
          r-version: "4.0.5"

      - uses: r-lib/actions/setup-pandoc@v1

      - uses: jasp-stats/jasp-actions/setup-test-env@master
        with:
          requiresJAGS: true

      - name: Test coverage
        run: covr::codecov()
        shell: Rscript {0}
